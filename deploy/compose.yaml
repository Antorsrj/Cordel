name: cordel

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cordel}
      POSTGRES_USER: ${POSTGRES_USER:-cordel_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - cordel-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  cordel-postgres:
    name: cordel-postgres
