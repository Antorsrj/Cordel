[package]
name = "cordel-phase0"
version = "0.1.0"
edition = "2021"
publish = false
description = "Linux Phase 0 feasibility client for ADR-101. Not a product build."

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures-util = "0.3"
livekit = "0.9"
log = "0.4"
slint = "1.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
slint-build = "1.14"
