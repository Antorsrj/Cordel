[package]
name = "cordel-state"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Client session recovery for ADR-102. Not a capture or media-device implementation."

[dependencies]
cordel-protocol = { path = "../../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# The operating system credential store. The keyring crate has no default
# backend: without a platform feature it falls back to a mock that never
# persists, so each platform names its own backend.
[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
optional = true
features = ["sync-secret-service"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
optional = true
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
optional = true
features = ["windows-native"]

[features]
secret-service = ["dep:keyring"]
# Test-only plain ws/http constructors for a local client-server smoke.
local-smoke = []
