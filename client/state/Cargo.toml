[package]
name = "cordel-state"
version = "0.1.0"
edition = "2021"
publish = false
description = "Client session recovery for ADR-102. Not a capture or media-device implementation."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dependencies.keyring]
version = "3"
optional = true

[features]
secret-service = ["dep:keyring"]
