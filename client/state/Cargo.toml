[package]
name = "cordel-state"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Client session recovery for ADR-102. Not a capture or media-device implementation."

[dependencies]
cordel-protocol = { path = "../../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dependencies.keyring]
version = "3"
optional = true

[features]
secret-service = ["dep:keyring"]
# Test-only plain ws/http constructors for a local client-server smoke.
local-smoke = []
