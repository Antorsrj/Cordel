name: Phase 0 Linux build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-linux.yml
      - client/phase0/**
      - client/media/**
      - client/state/**
      - protocol/**
      - docs/contracts/fixtures/**
  workflow_dispatch:

jobs:
  phase0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libclang-dev \
            libglib2.0-dev libpipewire-0.3-dev libgbm-dev libdrm-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev xvfb
      - name: Select Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Run Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo +1.99.1 clippy --manifest-path client/phase0/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee /tmp/cordel-phase0-clippy.log
      - name: Show Clippy error in public check result
        if: ${{ failure() && steps.clippy.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          output = Path('/tmp/cordel-phase0-clippy.log').read_text(errors='replace')
          excerpt = re.sub(r'\x1b\[[0-9;]*m', '', output[-3000:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Phase 0 Clippy failure::{excerpt}')
          PY
      - name: Run Phase 0 tests
        run: xvfb-run -a cargo +1.99.1 test --manifest-path client/phase0/Cargo.toml --locked
      - name: Build combined client
        run: cargo +1.99.1 build --manifest-path client/phase0/Cargo.toml --locked --release
      - name: Check formatting
        run: cargo +1.99.1 fmt --manifest-path client/phase0/Cargo.toml --all -- --check
