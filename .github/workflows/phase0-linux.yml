name: Phase 0 Linux build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-linux.yml
      - client/phase0/**
      - client/media/**
      - client/state/**
      - protocol/**
      - docs/contracts/fixtures/**
  workflow_dispatch:

jobs:
  phase0:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@v5
      - name: Select Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        id: format
        run: |
          cargo +1.99.1 fmt --manifest-path client/phase0/Cargo.toml --all
          git diff --binary -- client/phase0 > /tmp/cordel-phase0-rustfmt.patch
          test ! -s /tmp/cordel-phase0-rustfmt.patch
      - name: Show formatting patch in public check result
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from gzip import compress
          from pathlib import Path

          patch = Path('/tmp/cordel-phase0-rustfmt.patch').read_bytes()
          encoded = b64encode(compress(patch, compresslevel=9, mtime=0)).decode()
          chunks = [encoded[i:i + 2500] for i in range(0, len(encoded), 2500)]
          for index, chunk in enumerate(chunks[:10], 1):
              print(f'::error title=Rustfmt gzip patch {index}/{len(chunks)}::{chunk}')
          PY
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libclang-dev \
            libglib2.0-dev libpipewire-0.3-dev libgbm-dev libdrm-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev xvfb
      - name: Install clang 21 for WebRTC
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.asc
          key_fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-snapshot.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$key_fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 644 /tmp/llvm-snapshot.asc /usr/share/keyrings/llvm-snapshot.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21
          clang++-21 --version
      - name: Run Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo +1.99.1 clippy --manifest-path client/phase0/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee /tmp/cordel-phase0-clippy.log
      - name: Show Clippy error in public check result
        if: ${{ failure() && steps.clippy.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          output = Path('/tmp/cordel-phase0-clippy.log').read_text(errors='replace')
          excerpt = re.sub(r'\x1b\[[0-9;]*m', '', output[-3000:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Phase 0 Clippy failure::{excerpt}')
          PY
      - name: Run Phase 0 tests
        run: xvfb-run -a cargo +1.99.1 test --manifest-path client/phase0/Cargo.toml --locked
      - name: Build combined client
        run: cargo +1.99.1 build --manifest-path client/phase0/Cargo.toml --locked --release
