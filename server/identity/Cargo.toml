[package]
name = "cordel-identity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
axum = { version = "0.8", features = ["json", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
cordel-protocol = { path = "../../protocol" }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
cordel-state = { path = "../../client/state", features = ["local-smoke"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
